[project]
name = "spendwise-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy>=2.0.44,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.17,<2",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "mypy>=1.18,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
